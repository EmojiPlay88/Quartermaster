name: cross-platform

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests, every package and its smoke tests on Windows, macOS and Linux (steps in package.yml, shared with release.yml).
  build-test:
    uses: ./.github/workflows/package.yml
